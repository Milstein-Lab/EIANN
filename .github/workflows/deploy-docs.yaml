name: Deploy Jupyter Book

on:
  # Trigger the workflow on push to main branch
  push:
    branches: [ main ]
  # Allow manual trigger
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install matplotlib
        pip install "jupyter-book==1.0.4.post1"
        pip install sphinx-autoapi
        pip install sphinx-togglebutton
        pip install PyYAML
        
    - name: Debug - Check current directory and structure
      run: |
        echo "Current working directory:"
        pwd
        echo ""
        echo "Contents of root directory:"
        ls -la
        echo ""
        echo "Contents of docs directory:"
        ls -la docs/ || echo "docs directory not found"
        echo ""
        echo "Checking for _build directory:"
        if [ -d "docs/_build" ]; then
          echo "_build directory exists, contents:"
          find docs/_build -type f -o -type d | head -20
        else
          echo "_build directory does not exist"
        fi
        
    - name: Clean build directory
      run: |
        echo "Cleaning _build directory if it exists..."
        rm -rf docs/_build || echo "No _build directory to clean"
        echo "After cleaning, checking docs directory:"
        ls -la docs/ | head -20
        
    - name: Debug - Test glob pattern issue
      run: |
        echo "Creating a backup of _toc.yml and testing without glob pattern..."
        cp docs/_toc.yml docs/_toc.yml.backup
        echo ""
        echo "Testing if glob pattern is the issue by checking what it would match..."
        python3 << 'EOF'
        import yaml
        import os
        import glob as glob_module
        
        # Read the TOC
        with open('docs/_toc.yml', 'r') as f:
            toc = yaml.safe_load(f)
        
        # Find the glob pattern
        def find_glob(entry):
            if isinstance(entry, dict):
                if 'glob' in entry:
                    return entry['glob']
                if 'chapters' in entry:
                    for ch in entry['chapters']:
                        result = find_glob(ch)
                        if result:
                            return result
            elif isinstance(entry, list):
                for item in entry:
                    result = find_glob(item)
                    if result:
                        return result
            return None
        
        glob_pattern = None
        if 'parts' in toc:
            for part in toc['parts']:
                if 'chapters' in part:
                    glob_pattern = find_glob(part['chapters'])
                    if glob_pattern:
                        break
        
        if glob_pattern:
            print(f"Found glob pattern: {glob_pattern}")
            # Check what matches BEFORE build (autoapi files don't exist yet)
            full_pattern = os.path.join('docs', glob_pattern)
            matches = glob_module.glob(full_pattern)
            print(f"Matches before build: {len(matches)}")
            for match in matches[:10]:
                print(f"  - {match} ({'DIR' if os.path.isdir(match) else 'FILE'})")
            
            # Also check with .rst extension (what autoapi generates)
            rst_pattern = full_pattern + '.rst'
            rst_matches = glob_module.glob(rst_pattern)
            print(f"\nWith .rst extension: {len(rst_matches)} matches")
            for match in rst_matches[:10]:
                print(f"  - {match}")
        else:
            print("No glob pattern found in TOC")
        EOF
        
    - name: Debug - Check file types in docs
      run: |
        echo "Checking for problematic files/directories in docs:"
        find docs/ -maxdepth 3 -type d \( -name "_build" -o -name ".ipynb_checkpoints" \) | head -10
        echo ""
        echo "Checking notebooks in docs:"
        find docs/ -name "*.ipynb" | head -10
        echo ""
        echo "Checking autoapi directory structure:"
        if [ -d "docs/_build/html/autoapi" ]; then
          echo "AutoAPI already exists in _build:"
          find docs/_build/html/autoapi -type f -o -type d | head -20
        fi
        if [ -d "docs/autoapi" ]; then
          echo "AutoAPI source directory exists:"
          find docs/autoapi -type f -o -type d | head -20
        else
          echo "AutoAPI source directory does not exist (will be generated)"
        fi
        echo ""
        echo "Validating _toc.yml references:"
        python3 << 'EOF'
        import yaml
        import os
        import glob as glob_module
        
        with open('docs/_toc.yml', 'r') as f:
            toc = yaml.safe_load(f)
        
        def check_file(path, base='docs'):
            full_path = os.path.join(base, path)
            if os.path.isdir(full_path):
                return f"WARNING: {path} is a directory, not a file"
            elif os.path.isfile(full_path):
                return f"OK: {path} exists"
            else:
                return f"ERROR: {path} does not exist"
        
        def check_glob(glob_pattern, base='docs'):
            full_pattern = os.path.join(base, glob_pattern)
            matches = glob_module.glob(full_pattern)
            print(f"GLOB PATTERN: {glob_pattern}")
            print(f"  Matches {len(matches)} items:")
            for match in matches[:20]:
                if os.path.isdir(match):
                    print(f"    DIR:  {match}")
                elif os.path.isfile(match):
                    print(f"    FILE: {match}")
                else:
                    print(f"    ???:  {match}")
        
        def check_toc(entry, base='docs'):
            if isinstance(entry, dict):
                if 'file' in entry:
                    print(check_file(entry['file'], base))
                if 'glob' in entry:
                    check_glob(entry['glob'], base)
                if 'chapters' in entry:
                    for ch in entry['chapters']:
                        check_toc(ch, base)
            elif isinstance(entry, list):
                for item in entry:
                    check_toc(item, base)
        
        if 'parts' in toc:
            for part in toc['parts']:
                if 'chapters' in part:
                    check_toc(part['chapters'])
        EOF
        
    - name: Build the book (with detailed error capture)
      run: |
        echo "Starting jupyter-book build..."
        echo "Working directory: $(pwd)"
        echo "Building from: docs/"
        echo "Python version:"
        python --version
        echo "jupyter-book version:"
        jupyter-book --version || pip show jupyter-book
        echo ""
        echo "Running build..."
        set -x
        jupyter-book build docs/ 2>&1 | tee build_output.log
        BUILD_EXIT=${PIPESTATUS[0]}
        set +x
        echo ""
        echo "Build command completed (exit code: $BUILD_EXIT)"
        if [ $BUILD_EXIT -ne 0 ]; then
          echo "=== BUILD FAILED ==="
          echo "Last 100 lines of build output:"
          tail -100 build_output.log
        else
          echo "=== BUILD SUCCEEDED ==="
        fi
        
    - name: Debug - Check build output
      run: |
        echo "Checking if _build/html exists:"
        if [ -d "docs/_build/html" ]; then
          echo "_build/html is a directory (good)"
          echo "Contents of _build/html:"
          ls -la docs/_build/html | head -20
          echo ""
          echo "Checking size of _build/html:"
          du -sh docs/_build/html
        else
          echo "ERROR: _build/html does not exist or is not a directory"
          echo "Checking what _build contains:"
          ls -la docs/_build/ 2>&1 || echo "Cannot list _build"
        fi
        
    - name: Setup Pages
      uses: actions/configure-pages@v3
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/_build/html

  # Deploy job
  deploy:
    # Add a dependency to the build job
    needs: build-docs
    
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4