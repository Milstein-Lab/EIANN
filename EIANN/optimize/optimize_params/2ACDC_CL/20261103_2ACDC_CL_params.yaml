van_bp_SI_relu_SGD:
    #    starting values: van_bp_relu_SGD, plus H_si_lambda and Output_si_lambda at the optimize config's x0; not optimized
    #    5 seeds: fails (66052_260 diverges, as without SI); the other 4: phase0_reward 1.0, phase1_reward 0.45,
    #    phase2_reward 0.40-0.45, phase3_reward 0.45-0.75 (one seed keeps track 1 at 0.5 after relearning track 2).
    #    At the MNIST x0 (si_lambda 0.1), 3 of 5 seeds diverge
