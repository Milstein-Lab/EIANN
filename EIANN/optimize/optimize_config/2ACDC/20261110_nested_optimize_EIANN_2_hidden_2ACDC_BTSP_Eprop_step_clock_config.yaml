kwargs:
    network_id: 1
    task_id: 2
    seed_start: 1
    num_instances: 5
    data_seed_start: 1
    status_bar: False
    train_episodes: 1000
    algorithm: OnlineQLearning
    algorithm_kwargs:
        epsilon_min: 0.
        accumulate_updates: False # BTSP_Eprop weights change after every step
        trace_clock: step # traces tick once per environment step, after all 5 integration substeps (substep version: BTSP_Eprop)
    treadmill_kwargs:
        length: 23
        cue_position: 8
        cue_length: 3
        num_cues: 2
        reward_positions:
            - 15
            - 19
        reward_length: 2
        # (ignore, correct lick, wrong lick): the 2ACDC values (0., 1., -0.1) shifted by +0.1 so that all Q targets
        # are >= 0 (BTSP E weights are non-negative); every lap has the same length, so the optimal policy is unchanged,
        # and the reward feature is reported relative to a lap without licks, in the unshifted units
        reward_values:
            - 0.1
            - 1.1
            - 0.
    network_config_file_path: optimize/network_config/2ACDC/20261109_EIANN_2_hidden_2ACDC_BTSP_Eprop_config.yaml
    val_interval:
        - -1000
        - -1
        - 10
    num_episodes_reward_window: 200
update_context:
    - source: optimize.nested_optimize_EIANN_2ACDC
      function: update_EIANN_config_2_hidden_2ACDC_BTSP_Continuous  # works with BTSP_Eprop
    - source: optimize.nested_optimize_EIANN_2ACDC
      function: update_tau
    - source: optimize.nested_optimize_EIANN_2ACDC
