layer_config:
    Input:
        E:
            channels: 3
            image_dim: 32
    ConvBlock1:
        ConvE1:
            population_type: Conv2D
            channels: 64
            kernel_size: 3
            image_source: Input.E
            activation: relu
        ConvE2:
            population_type: Conv2D
            channels: 64
            kernel_size: 3
            image_source: ConvBlock1.ConvE1
            activation: relu
        MaxPoolE:
            population_type: MaxPool2D
            kernel_size: 2
            source: ConvBlock1.ConvE2
    ConvBlock2:
        ConvE1:
            population_type: Conv2D
            channels: 128
            kernel_size: 3
            image_source: ConvBlock1.MaxPoolE
            activation: relu
        ConvE2:
