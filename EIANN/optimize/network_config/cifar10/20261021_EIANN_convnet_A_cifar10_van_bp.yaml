            channels: 128
            kernel_size: 3
            image_source: ConvBlock2.ConvE1
            activation: relu
        MaxPoolE:
            population_type: MaxPool2D
            kernel_size: 2
            source: ConvBlock2.ConvE2
        FlatE:
            population_type: Flatten
            source: ConvBlock2.MaxPoolE
    H1:
        E:
            size: 512
            activation: relu
    H2:
        E:
            size: 512
            activation: relu
    Output:
        E:
            size: 10
            activation: relu
