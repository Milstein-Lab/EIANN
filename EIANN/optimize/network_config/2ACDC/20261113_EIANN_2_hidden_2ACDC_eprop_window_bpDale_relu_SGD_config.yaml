# Dale's law (E and SomaI populations) Q network trained with windowed e-prop (Eprop_Window, rules/eprop.py) on every
# projection, E and SomaI: eprop_bpDale_learnedI_relu_SGD's network (H1 E recurrent, H2 E with no E->E recurrence)
# with forward_steps 15 and backward_steps 3. Within the last 3 substeps of every step the gradient is exact backprop
# (all paths, including SomaI -> E one substep later, so SomaI learns without Eprop_SomaI); before them, e-prop's
# trace term, dL/ds(window start) x e. Needs trace_clock: step in algorithm_kwargs: traces tick once per environment
# step (trace_tau in steps, set by update_eprop_trace_tau) and are paired with the learning signal at the window's
# first substep. Works with update_EIANN_config_2_hidden_2ACDC_bpDale_relu_SGD (H_E_I_learning_rate onto E from
# SomaI, H_I_E_learning_rate onto SomaI).


layer_config:
    Input:
        E:
            size: 5
    H1:
        E:
            size: 50
            activation: relu
        SomaI:
            size: 10
            activation: relu
    H2:
        E:
            size: 50
            activation: relu
        SomaI:
            size: 10
            activation: relu
    Output:
        E:
            size: 2
            activation: linear
        SomaI:
            size: 2
            activation: relu
projection_config:
    H1:
        E:
            Input:
                E:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - 0
                        - null
                    direction: F
                    learning_rule: Eprop_Window
                    learning_rule_kwargs:
                        learning_rate: 0.1
            H1:
                E:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - 0
                        - null
                    weight_constraint: no_autapses
                    direction: R
                    learning_rule: Eprop_Window
                    learning_rule_kwargs:
                        learning_rate: 0.1
                SomaI:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - null
                        - 0
                    direction: R
                    learning_rule: Eprop_Window
                    learning_rule_kwargs:
                        learning_rate: 0.1
        SomaI:
            Input:
                E:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - 0
                        - null
                    direction: F
                    learning_rule: Eprop_Window
                    learning_rule_kwargs:
                        learning_rate: 0.1
            H1:
                E:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - 0
                        - null
                    direction: R
                    learning_rule: Eprop_Window
                    learning_rule_kwargs:
                        learning_rate: 0.1
                SomaI:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - null
                        - 0.
                    weight_constraint: no_autapses
                    direction: R
                    learning_rule: Eprop_Window
                    learning_rule_kwargs:
                        learning_rate: 0.1
    H2:
        E:
            H1:
                E:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - 0
                        - null
                    direction: F
                    learning_rule: Eprop_Window
                    learning_rule_kwargs:
                        learning_rate: 0.1
            H2:
                SomaI:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - null
                        - 0
                    direction: R
                    learning_rule: Eprop_Window
                    learning_rule_kwargs:
                        learning_rate: 0.1
        SomaI:
            H1:
                E:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - 0
                        - null
                    direction: F
                    learning_rule: Eprop_Window
                    learning_rule_kwargs:
                        learning_rate: 0.1
            H2:
                E:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - 0
                        - null
                    direction: R
                    learning_rule: Eprop_Window
                    learning_rule_kwargs:
                        learning_rate: 0.1
                SomaI:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - null
                        - 0.
                    weight_constraint: no_autapses
                    direction: R
                    learning_rule: Eprop_Window
                    learning_rule_kwargs:
                        learning_rate: 0.1
    Output:
        E:
            H2:
                E:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - 0
                        - null
                    direction: F
                    learning_rule: Eprop_Window
                    learning_rule_kwargs:
                        learning_rate: 0.1
            Output:
                SomaI:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - null
                        - 0
                    direction: R
                    learning_rule: Eprop_Window
                    learning_rule_kwargs:
                        learning_rate: 0.1
        SomaI:
            H2:
                E:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - 0
                        - null
                    direction: F
                    learning_rule: Eprop_Window
                    learning_rule_kwargs:
                        learning_rate: 0.1
            Output:
                E:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - 0
                        - null
                    direction: R
                    learning_rule: Eprop_Window
                    learning_rule_kwargs:
                        learning_rate: 0.1
                SomaI:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - null
