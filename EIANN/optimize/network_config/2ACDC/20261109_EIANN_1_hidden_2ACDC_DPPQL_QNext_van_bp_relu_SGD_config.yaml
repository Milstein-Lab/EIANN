# QNext network of DPPQL: reads the Q network's H1E activity (size 100) and predicts max_a Q(s_{t+1}, a).
# No recurrence; run without persistent state. Ported from the reinforcement_learning branch's
# treadmill_DNQL/hidden_treadmill_DNQL_QNext_Network_van_bp_relu_SGD_config.yaml (Input resized from 50 to 100).
# Works with Q networks 20261102_EIANN_2_hidden_2ACDC_{van_bp,eprop}_relu_SGD_config.yaml.

layer_config:
    Input:
        E:
            size: 100
    H1:
        E:
            size: 50
            activation: relu
    Output:
        E:
            size: 1
            activation: linear

projection_config:
    H1:
        E:
            Input:
                E:
                    weight_init: scaled_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    direction: F
                    learning_rule: Backprop
                    learning_rule_kwargs:
                        learning_rate: 1.
    Output:
        E:
            H1:
                E:
                    weight_init: scaled_kaiming
                    weight_init_args: !!python/tuple
                        - 1.2
                    direction: F
                    learning_rule: Backprop
                    learning_rule_kwargs:
                        learning_rate: 1.

training_kwargs:
    tau: 1
    forward_steps: 1
    backward_steps: 1
    persistent_state: False
    learning_rate: 1.
    verbose: False
    optimizer: SGD
