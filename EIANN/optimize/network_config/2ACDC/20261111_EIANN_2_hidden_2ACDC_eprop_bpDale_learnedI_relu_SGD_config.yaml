# Dale's law (E and SomaI populations) Q network trained with e-prop, with learned inhibition: eprop_bpDale_relu_SGD
# (H1 E recurrent, H2 E with no E->E recurrence, forward_steps 5) with every projection learned. Eprop on the 7
# projections onto E, including the 3 E <- SomaI; Eprop_SomaI on the 9 projections onto SomaI, which reach the loss
# only through the recurrent E <- SomaI projections, so their learning signal is taken one substep back (see
# rules/eprop.py). Compare with eprop_bpDale_relu_SGD (SomaI fixed) and bpDale_frozenI_relu_SGD / bpDale_relu_SGD.
# Needs trace_clock: substep in algorithm_kwargs (Eprop and Eprop_SomaI traces tick every integration substep).
# backward_steps 1: e-prop's learning signal is taken within the last substep (Eprop_SomaI's one substep earlier).
# Works with update_EIANN_config_2_hidden_2ACDC_bpDale_relu_SGD (H_E_I_learning_rate onto E from SomaI,
# H_I_E_learning_rate onto SomaI).


layer_config:
    Input:
        E:
            size: 5
    H1:
        E:
            size: 50
            activation: relu
        SomaI:
            size: 10
            activation: relu
    H2:
        E:
            size: 50
            activation: relu
        SomaI:
            size: 10
            activation: relu
    Output:
        E:
            size: 2
            activation: linear
        SomaI:
            size: 2
            activation: relu
projection_config:
    H1:
        E:
            Input:
                E:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - 0
                        - null
                    direction: F
                    learning_rule: Eprop
                    learning_rule_kwargs:
                        learning_rate: 0.1
            H1:
                E:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - 0
                        - null
                    weight_constraint: no_autapses
                    direction: R
                    learning_rule: Eprop
                    learning_rule_kwargs:
                        learning_rate: 0.1
                SomaI:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - null
                        - 0
                    direction: R
                    learning_rule: Eprop
                    learning_rule_kwargs:
                        learning_rate: 0.1
        SomaI:
            Input:
                E:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - 0
                        - null
                    direction: F
                    learning_rule: Eprop_SomaI
                    learning_rule_kwargs:
                        learning_rate: 0.1
            H1:
                E:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - 0
                        - null
                    direction: R
                    learning_rule: Eprop_SomaI
                    learning_rule_kwargs:
                        learning_rate: 0.1
                SomaI:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - null
                        - 0.
                    weight_constraint: no_autapses
                    direction: R
                    learning_rule: Eprop_SomaI
                    learning_rule_kwargs:
                        learning_rate: 0.1
    H2:
        E:
            H1:
                E:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - 0
                        - null
                    direction: F
                    learning_rule: Eprop
                    learning_rule_kwargs:
                        learning_rate: 0.1
            H2:
                SomaI:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - null
                        - 0
                    direction: R
                    learning_rule: Eprop
                    learning_rule_kwargs:
                        learning_rate: 0.1
        SomaI:
            H1:
                E:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - 0
                        - null
                    direction: F
                    learning_rule: Eprop_SomaI
                    learning_rule_kwargs:
                        learning_rate: 0.1
            H2:
                E:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - 0
                        - null
                    direction: R
                    learning_rule: Eprop_SomaI
                    learning_rule_kwargs:
                        learning_rate: 0.1
                SomaI:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - null
                        - 0.
                    weight_constraint: no_autapses
                    direction: R
                    learning_rule: Eprop_SomaI
                    learning_rule_kwargs:
                        learning_rate: 0.1
    Output:
        E:
            H2:
                E:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - 0
                        - null
                    direction: F
                    learning_rule: Eprop
                    learning_rule_kwargs:
                        learning_rate: 0.1
            Output:
                SomaI:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - null
                        - 0
                    direction: R
                    learning_rule: Eprop
                    learning_rule_kwargs:
                        learning_rate: 0.1
        SomaI:
            H2:
                E:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - 0
                        - null
                    direction: F
                    learning_rule: Eprop_SomaI
                    learning_rule_kwargs:
                        learning_rate: 0.1
            Output:
                E:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - 0
                        - null
                    direction: R
                    learning_rule: Eprop_SomaI
                    learning_rule_kwargs:
                        learning_rate: 0.1
                SomaI:
                    weight_init: half_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_bounds:
                        - null
                        - 0
                    weight_constraint: no_autapses
                    direction: R
                    learning_rule: Eprop_SomaI
                    learning_rule_kwargs:
                        learning_rate: 0.1
training_kwargs:
    tau: 3
    forward_steps: 5
    backward_steps: 1
    persistent_state: True
    learning_rate: 0.2
    verbose: False
    optimizer: SGD
