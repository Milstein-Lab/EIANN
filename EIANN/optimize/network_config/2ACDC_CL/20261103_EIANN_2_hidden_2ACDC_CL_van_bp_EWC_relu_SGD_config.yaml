layer_config:
    Input:
        E:
            size: 5
    H1:
        E:
            size: 100
            activation: relu
    H2:
        E:
            size: 100
            activation: relu
    Output:
        E:
            size: 2
            activation: linear

projection_config:
    H1:
        E:
            Input:
                E:
                    weight_init: scaled_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    direction: F
                    learning_rule: Backprop_EWC
                    learning_rule_kwargs:
                        learning_rate: 1.
                        ewc_lambda: 100.
                        importance_source: external # importance from RLAlgorithm.end_task, not the rule's sample cache
            H1:
                E:
                    weight_init: scaled_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    weight_constraint: no_autapses
                    direction: R
                    learning_rule: Backprop_EWC
                    learning_rule_kwargs:
                        learning_rate: 1.
                        ewc_lambda: 100.
                        importance_source: external # importance from RLAlgorithm.end_task, not the rule's sample cache
    H2:
        E:
            H1:
                E:
                    weight_init: scaled_kaiming
                    weight_init_args: !!python/tuple
                        - 1.
                    direction: F
                    learning_rule: Backprop_EWC
                    learning_rule_kwargs:
                        learning_rate: 1.
                        ewc_lambda: 100.
                        importance_source: external # importance from RLAlgorithm.end_task, not the rule's sample cache
    Output:
        E:
            H2:
                E:
                    weight_init: scaled_kaiming
                    weight_init_args: !!python/tuple
                        - 1.2
                    direction: F
                    learning_rule: Backprop_EWC
                    learning_rule_kwargs:
                        learning_rate: 1.
                        ewc_lambda: 100.
                        importance_source: external # importance from RLAlgorithm.end_task, not the rule's sample cache

training_kwargs:
    tau: 1
    forward_steps: 1
    backward_steps: 1
    persistent_state: True
    learning_rate: 1.
    verbose: False
    optimizer: SGD
