layer_config:
    Input:
        E:
            size: 784
    H1:
        E:
            size: 500
            activation: relu
    H2:
        E:
            size: 500
            activation: relu
    Output:
        E:
            size: 10
            activation: relu

projection_config:
    H1:
        E:
            Input:
                E:
                    weight_init: scaled_kaiming
                    weight_init_args: !!python/tuple
                        - 1
                    direction: F
                    learning_rule: Backprop_SILR_B
                    learning_rule_kwargs:
                        learning_rate: 0.2
                        silr_threshold: 0.5
                        silr_width: 0.5
                        silr_min: 0.
    H2:
        E:
            H1:
                E:
                    weight_init: scaled_kaiming
                    weight_init_args: !!python/tuple
                        - 1
                    direction: F
                    learning_rule: Backprop_SILR_B
                    learning_rule_kwargs:
                        learning_rate: 0.2
                        silr_threshold: 0.5
                        silr_width: 0.5
                        silr_min: 0.
    Output:
        E:
            H2:
                E:
                    weight_init: scaled_kaiming
                    weight_init_args: !!python/tuple
                        - 1
                    direction: F
                    learning_rule: Backprop_SILR_B
                    learning_rule_kwargs:
                        learning_rate: 0.2
                        silr_threshold: 0.5
                        silr_width: 0.5
                        silr_min: 0.

training_kwargs:
    tau: 1
    forward_steps: 1
    backward_steps: 1
    learning_rate: 0.2
    verbose: False
    optimizer: SGD
