layer_config:
    Input:
        E:
            size: 5
    H1:
        E:
            size: 100
            activation: relu
    H2:
        E:
            size: 100
            activation: relu
    Output:
        E:
            size: 2
            activation: linear
projection_config:
    H1:
        E:
            Input:
                E:
                    weight_init: scaled_kaiming
                    weight_init_args: !!python/tuple
                    - 1.0
                    direction: F
                    learning_rule: Backprop
                    learning_rule_kwargs:
                        learning_rate: 1.0
            H1:
                E:
                    weight_init: scaled_kaiming
                    weight_init_args: !!python/tuple
                    - 1.0
                    weight_constraint: no_autapses
                    direction: R
                    learning_rule: Backprop
                    learning_rule_kwargs:
                        learning_rate: 1.0
    H2:
        E:
            H1:
                E:
                    weight_init: scaled_kaiming
                    weight_init_args: !!python/tuple
                    - 1.0
                    direction: F
                    learning_rule: Backprop
                    learning_rule_kwargs:
                        learning_rate: 1.0
    Output:
        E:
            H2:
                E:
                    weight_init: scaled_kaiming
                    weight_init_args: !!python/tuple
                    - 1.2
                    direction: F
                    learning_rule: Backprop
                    learning_rule_kwargs:
                        learning_rate: 1.0
training_kwargs:
    tau: 1
    forward_steps: 1
    backward_steps: 1
    persistent_state: true
    learning_rate: 1.0
    verbose: false
    optimizer: SGD
algorithm: QLearning
algorithm_kwargs:
    epsilon_min: 0.0
    gamma: 0.9
    epsilon: 0.9
    epsilon_decay: 1.0
