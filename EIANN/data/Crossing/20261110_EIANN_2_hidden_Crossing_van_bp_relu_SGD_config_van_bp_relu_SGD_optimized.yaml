layer_config:
    Input:
        E:
            size: 36
    H1:
        E:
            size: 100
            activation: relu
    H2:
        E:
            size: 100
            activation: relu
    Output:
        E:
            size: 3
            activation: linear
projection_config:
    H1:
        E:
            Input:
                E:
                    weight_init: scaled_kaiming
                    weight_init_args: !!python/tuple
                    - 1.0
                    direction: F
                    learning_rule: Backprop
                    learning_rule_kwargs:
                        learning_rate: 0.03
            H1:
                E:
                    weight_init: scaled_kaiming
                    weight_init_args: !!python/tuple
                    - 1.0
                    weight_constraint: no_autapses
                    direction: R
                    learning_rule: Backprop
                    learning_rule_kwargs:
                        learning_rate: 0.03
    H2:
        E:
            H1:
                E:
                    weight_init: scaled_kaiming
                    weight_init_args: !!python/tuple
                    - 1.0
                    direction: F
                    learning_rule: Backprop
                    learning_rule_kwargs:
                        learning_rate: 0.03
    Output:
        E:
            H2:
                E:
                    weight_init: scaled_kaiming
                    weight_init_args: !!python/tuple
                    - 1.2
                    direction: F
                    learning_rule: Backprop
                    learning_rule_kwargs:
                        learning_rate: 0.03
training_kwargs:
    tau: 1
    forward_steps: 1
    backward_steps: 1
    persistent_state: true
    learning_rate: 1.0
    verbose: false
    optimizer: SGD
    criterion_kwargs:
        reduction: sum
algorithm: QLearning
algorithm_kwargs:
    epsilon_min: 0.05
    epsilon_schedule: decay
    gamma: 0.9
    epsilon: 0.999
    epsilon_decay: 0.9995
